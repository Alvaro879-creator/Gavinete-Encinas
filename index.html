<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Citas - Peluquería Style & Cut</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navegación -->
  <header class="header">
    <div class="logo">
      <i class="fa-solid fa-scissors"></i>
      <span>Style & Cut</span>
    </div>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('booking')">
        <i class="fa-regular fa-calendar-check"></i> Reservar
      </button>
      <button class="tab-btn" onclick="switchTab('appointments')">
        <i class="fa-solid fa-list-check"></i> Citas Guardadas
      </button>
    </nav>
  </header>

  <!-- Contenedor Principal -->
  <main class="container">

    <!-- SECCIÓN DE RESERVA -->
    <section id="bookingTab" class="tab-content active">
      <div class="card">
        <h2><i class="fa-solid fa-calendar-days"></i> Reserva tu Cita de Tarde</h2>
        <p class="subtitle">Selecciona tu servicio, el día y la hora disponible que mejor te convenga.</p>

        <form id="bookingForm">
          <!-- Paso 1: Datos Personales -->
          <div class="form-group">
            <label for="clientName"><i class="fa-solid fa-user"></i> Nombre Completo</label>
            <input type="text" id="clientName" placeholder="Ej: Carlos Gómez" required>
          </div>

          <div class="form-group">
            <label for="clientPhone"><i class="fa-solid fa-phone"></i> Teléfono de Contacto</label>
            <input type="tel" id="clientPhone" placeholder="Ej: 600 123 456" required>
          </div>

          <!-- Paso 2: Elección de Servicio -->
          <div class="form-group">
            <label for="serviceSelect"><i class="fa-solid fa-scissors"></i> Servicio</label>
            <select id="serviceSelect">
              <option value="Corte de Pelo Completo">Corte de Pelo Completo (30 min)</option>
              <option value="Corte de Pelo y Barba">Corte de Pelo + Arreglo de Barba (30 min)</option>
              <option value="Arreglo de Barba">Arreglo / Perfilado de Barba (30 min)</option>
              <option value="Peinado / Lavado">Peinado / Lavado (30 min)</option>
            </select>
          </div>

          <!-- Paso 3: Selección de Día -->
          <div class="form-group">
            <label for="bookingDate"><i class="fa-regular fa-calendar"></i> Fecha para la Cita</label>
            <input type="date" id="bookingDate" required>
          </div>

          <!-- Paso 4: Selección de Horario de Tarde (30 min) -->
          <div class="form-group">
            <label><i class="fa-regular fa-clock"></i> Horarios Disponibles de Tarde</label>
            <div id="slotsContainer" class="slots-grid">
              <!-- Se generará dinámicamente con JavaScript -->
            </div>
            <p id="slotError" class="error-msg">Por favor, selecciona un tramo horario disponible.</p>
          </div>

          <!-- Botón de Confirmación -->
          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-check"></i> Confirmar Reserva
          </button>
        </form>
      </div>
    </section>

    <!-- SECCIÓN DE CITAS REGISTRADAS -->
    <section id="appointmentsTab" class="tab-content">
      <div class="card">
        <h2><i class="fa-solid fa-book-bookmark"></i> Citas Programadas</h2>
        <p class="subtitle">Consulta o gestiona los turnos ocupados y reservados.</p>

        <div class="filter-group">
          <label for="filterDate"><i class="fa-solid fa-filter"></i> Filtrar por Día:</label>
          <input type="date" id="filterDate">
          <button type="button" class="btn-secondary" onclick="resetFilter()">Ver Todos</button>
        </div>

        <div id="appointmentsList" class="appointments-grid">
          <!-- Las citas guardadas se listarán dinámicamente -->
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
